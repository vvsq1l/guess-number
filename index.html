<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Угадай число</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="game-card">
        <h1>Угадай число</h1>
        <div class="inputNumber">
            <input id="inputNum" type="text" placeholder="Угадай число от 1 до 100">
            <button id="btnCheck">Проверить</button>
            <button id="btnReset">Новая игра</button>
        </div>
        <div class="result">
        <p id="message">Введите число и нажмите проверить</p>
        <p id="attempt">Попыток: 0</p>
        </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
